# Production stack. Two shapes, one file:
#
# A. Host already runs a web server (our case: nginx serving other-site.example).
#    The stack binds nothing public; the host's nginx proxies to it.
#
#      host nginx :443  ->  127.0.0.1:8080 (web)  ->  server :3001  ->  db :5432
#      docker compose -f docker-compose.prod.yml up -d --build
#
# B. Dedicated box with ports 80/443 free. Caddy fronts it and gets a Let's
#    Encrypt certificate automatically.
#
#      caddy :80/:443  ->  web  ->  server :3001  ->  db :5432
#      docker compose -f docker-compose.prod.yml --profile caddy up -d --build
#
# Caddy only starts when its profile is named, so on a shared host it can never
# steal :80/:443 from whatever is already serving there.
#
# Unlike docker-compose.yml (local development) nothing here has a default
# credential and the database is not reachable from outside the compose network.
# Every value comes from .env - see .env.example.

services:
  db:
    image: postgres:16-alpine
    container_name: toepen-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - toepen-db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Deliberately no `ports:` - the database is reachable only from this
    # network, never from the public internet.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  server:
    build: ./server
    container_name: toepen-server
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: '3001'
      NODE_ENV: production
      # No fallback on purpose: the server refuses to start in production
      # without this, and a guessable signing key means forgeable logins.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # Players reach the API same-origin through nginx, so this stays empty
      # unless another origin genuinely needs access.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Number of proxies in front of the server, so rate limiting keys on the
      # real client IP and no further. 1 = host nginx only (shape A),
      # 2 = caddy -> nginx (shape B).
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
    depends_on:
      db:
        condition: service_healthy
    # Not published either: only nginx talks to the server.
    restart: unless-stopped

  web:
    build: ./web
    container_name: toepen-web
    ports:
      # Bound to loopback only: reachable by the host's nginx (shape A) and by
      # caddy over the compose network (shape B), never from the internet.
      - '127.0.0.1:${WEB_BIND_PORT:-8080}:80'
    depends_on:
      - server
    restart: unless-stopped

  # Only started with `--profile caddy` (shape B above).
  caddy:
    image: caddy:2-alpine
    container_name: toepen-caddy
    profiles: ['caddy']
    environment:
      # Required only for this profile. Compose interpolates every service's
      # variables even when the profile is inactive, so these cannot use the
      # `:?` guard or they would block shape A, which needs neither.
      DOMAIN: ${DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account keys must survive a restart, or Let's
      # Encrypt rate limits will eventually refuse to reissue.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  toepen-db-data:
  caddy-data:
  caddy-config:
