# Defines $connection_upgrade for WebSocket proxying. Goes in /etc/nginx/conf.d/
# so it lands inside the http block:
#
#   scp deploy/nginx-map-upgrade.conf root@HOST:/etc/nginx/conf.d/map-upgrade.conf
#
# This only defines a variable. It changes no existing site: sites that do not
# reference $connection_upgrade are completely unaffected.
#
# It matters because a plain `Connection: upgrade` on every request is wrong for
# ordinary HTTP. The map sends "upgrade" only when the client actually asked to
# upgrade, and "close" otherwise.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
