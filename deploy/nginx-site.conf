# nginx site for a host that already serves other things. Install it alongside
# the existing sites — it touches nothing else:
#
#   scp deploy/nginx-map-upgrade.conf root@HOST:/etc/nginx/conf.d/map-upgrade.conf
#   scp deploy/nginx-site.conf root@HOST:/etc/nginx/sites-available/toepen
#   # replace TOEPEN_DOMAIN with the real hostname
#   ln -s /etc/nginx/sites-available/toepen /etc/nginx/sites-enabled/toepen
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d TOEPEN_DOMAIN     # adds the TLS lines below this block
#
# certbot rewrites this file when it issues the certificate: it adds `listen
# 443 ssl`, the certificate paths, and a second server block redirecting :80.
# That is expected — leave its managed lines alone.

server {
    listen 80;
    listen [::]:80;
    server_name TOEPEN_DOMAIN;

    # Everything is served by the toepen web container on loopback, which is
    # nginx inside Docker: it serves the SPA and forwards /api and /ws to the
    # game server. Nothing of this stack listens on a public port directly.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket upgrade for /ws — without these the live table silently
        # falls back to failing connections and players never see each other.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # A game socket is idle whenever nobody is acting; do not cut it.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
