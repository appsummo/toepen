<!DOCTYPE html>
<!-- `lang` is set at runtime from the player's language choice; this is only
     the value the first paint uses. -->
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the felt reaches under a notch; the layout keeps
         its content clear of it with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#271808" />
    <meta name="description" content="Play Toepen, the Dutch café card game, online with your friends. Bluff, knock and fold — no account needed." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Toepen — het café-kaartspel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Karla:wght@400;500;600;700&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
