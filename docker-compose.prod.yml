# Production stack: Caddy terminates TLS and proxies to nginx, which serves the
# SPA and forwards /api and /ws to the game server.
#
#   caddy :80/:443  ->  web (nginx :80)  ->  server :3001  ->  db :5432
#
# Unlike docker-compose.yml (local development) nothing here has a default
# credential and the database is not reachable from outside the compose network.
# Every value comes from .env - see .env.example.
#
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: postgres:16-alpine
    container_name: toepen-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - toepen-db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Deliberately no `ports:` - the database is reachable only from this
    # network, never from the public internet.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  server:
    build: ./server
    container_name: toepen-server
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: '3001'
      NODE_ENV: production
      # No fallback on purpose: the server refuses to start in production
      # without this, and a guessable signing key means forgeable logins.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # Players reach the API same-origin through nginx, so this stays empty
      # unless another origin genuinely needs access.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Client IPs arrive through caddy -> nginx; trust exactly those two hops
      # so rate limiting keys on the real address and no further.
      TRUST_PROXY_HOPS: '2'
    depends_on:
      db:
        condition: service_healthy
    # Not published either: only nginx talks to the server.
    restart: unless-stopped

  web:
    build: ./web
    container_name: toepen-web
    depends_on:
      - server
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: toepen-caddy
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account keys must survive a restart, or Let's
      # Encrypt rate limits will eventually refuse to reissue.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  toepen-db-data:
  caddy-data:
  caddy-config:
